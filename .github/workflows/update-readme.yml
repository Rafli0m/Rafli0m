name: Update README Last Updated

on:
  schedule:
    # Uji pembaruan otomatis setiap 5 menit.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-time
  cancel-in-progress: false

jobs:
  update-readme:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update Timestamp in README
        shell: bash
        run: |
          NOW=$(TZ='Asia/Jakarta' date '+%A, %d %B %Y, %H:%M:%S WIB (UTC+7)')
          if ! grep -qE '^<!-- Last Updated: .+ -->$' README.md; then
            echo "::error::Komentar Last Updated tidak ditemukan di README.md."
            exit 1
          fi
          sed -i -E "s|^<!-- Last Updated: .* -->$|<!-- Last Updated: ${NOW} -->|" README.md
          echo "README updated: ${NOW}"

      - name: Commit and Push Changes
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Last Updated timestamp [skip ci]"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
